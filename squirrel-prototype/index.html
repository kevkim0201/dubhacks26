<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Squirrel prototype</title>
    <style>
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 24px;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f3ea;
        color: #1f2d22;
      }
      h1 { font-size: 16px; margin: 0; }
      p.sub { margin: 0; color: #71806f; font-size: 12px; max-width: 420px; text-align: center; }
      #stage {
        width: 320px;
        height: 320px;
        border-radius: 16px;
        background: #e5efe3;
        overflow: hidden;
      }
      .token-row { display: flex; align-items: center; gap: 6px; font-size: 15px; }
      #token-count { font-weight: 800; font-size: 18px; }
      .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
      button {
        font: inherit;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #e4ddc9;
        background: #fdfaf4;
        cursor: pointer;
      }
      button.primary { background: #2f6b4f; color: #fff; border-color: #2f6b4f; }
      label.auto { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #71806f; }
      #feed {
        width: 320px;
        max-width: 90vw;
      }
      #feed h2 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #71806f; }
      #feed-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        min-height: 1.5em;
      }
      #feed-list li {
        padding: 6px 8px;
        background: #fdfaf4;
        border: 1px solid #e4ddc9;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Squirrel prototype</h1>
    <p class="sub">
      Standalone page, no build step -- proving the Three.js scene works before
      moving it into the extension. Placeholder geometry stands in for a real
      model; swap it for a .glb via GLTFLoader (see comments in squirrel.js).
    </p>
    <div id="stage"></div>
    <div class="token-row">
      <span>&#127792; Acorn tokens:</span>
      <span id="token-count">0</span>
    </div>
    <div class="controls">
      <button type="button" class="primary" id="simulate-purchase">Simulate a purchase</button>
      <label class="auto"><input type="checkbox" id="auto-toggle" checked /> Auto every 5s</label>
      <button type="button" id="reset">Reset</button>
    </div>
    <div id="feed">
      <h2>Recent activity</h2>
      <ul id="feed-list"></ul>
    </div>
    <script type="module" src="squirrel.js"></script>
  </body>
</html>
