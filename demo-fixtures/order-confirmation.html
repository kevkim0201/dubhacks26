<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Order Confirmed — Pinecone Outfitters</title>
    <style>
      body { font-family: -apple-system, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 20px; color: #1f2d22; }
      .brand { font-weight: 800; color: #2f6b4f; margin-bottom: 24px; }
      h1 { font-size: 22px; }
      .receipt { margin-top: 24px; padding: 20px; background: #f3f6f2; border-radius: 12px; }
      .row { display: flex; justify-content: space-between; padding: 6px 0; }
      .total { font-weight: 800; border-top: 1px solid #d7e0d9; margin-top: 8px; padding-top: 10px; }
      .saved { color: #2f6b4f; font-weight: 700; }
    </style>

    <!--
      Fixture 1/3 -- the "clean" path: a real schema.org Order block, like
      a well-built storefront's SEO markup. content.js's extractFromJsonLd()
      reads this directly instead of scraping rendered text -- the more
      reliable of its two extraction paths.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Order",
        "orderNumber": "PK-10293",
        "orderedItem": {
          "@type": "Product",
          "name": "Trailhead Wireless Headphones"
        },
        "priceSpecification": {
          "@type": "PriceSpecification",
          "price": "89.99",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <p class="brand">pinecone outfitters</p>
    <h1>Thank you for your order!</h1>
    <p>Order #PK-10293 is confirmed and on its way.</p>

    <div class="receipt">
      <div class="row"><span>Trailhead Wireless Headphones</span><span>$104.99</span></div>
      <div class="row saved"><span>Promo code SAVE15</span><span>&minus;$15.00</span></div>
      <div class="row total"><span>Total</span><span>$89.99</span></div>
    </div>

    <p>You saved $15.00 on this order. 🎉</p>
  </body>
</html>
