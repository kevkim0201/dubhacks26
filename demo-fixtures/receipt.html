<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Receipt</title>
    <style>
      body { font-family: -apple-system, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 20px; color: #1f2d22; }
      .brand { font-weight: 800; color: #2f6b4f; margin-bottom: 24px; }
      h1 { font-size: 22px; }
      .items { margin: 20px 0; }
      .item { display: flex; justify-content: space-between; padding: 6px 0; }
    </style>

    <!--
      Fixture 2/3 -- the fallback path: deliberately NO JSON-LD, so
      content.js's extractFromJsonLd() finds nothing and falls through to
      extractFromHeuristics(), which scrapes a "total $X.XX" pattern near
      the word "total" and an <h1> for the title. This is what most
      storefronts without SEO structured data look like.
    -->
  </head>
  <body>
    <p class="brand">daybreak market</p>
    <h1>Lantern Camp Stove — Order Confirmed</h1>
    <p>Order number: DM-88214</p>

    <div class="items">
      <div class="item"><span>Lantern Camp Stove</span><span>$149.00</span></div>
      <div class="item"><span>Member discount</span><span>&minus;$24.50</span></div>
    </div>

    <p>Order total: $124.50</p>
    <p>You saved $24.50 with your member discount.</p>
  </body>
</html>
