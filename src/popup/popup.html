<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DubHacks 26</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <h1>DubHacks 26</h1>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span>Enabled</span>
      </label>
    </header>

    <section class="card">
      <p class="label">Current tab</p>
      <p class="value" id="tab-title">&hellip;</p>
      <p class="url" id="tab-url"></p>
    </section>

    <div class="actions">
      <button id="toggle-panel" type="button" class="primary">Toggle panel</button>
      <button id="open-options" type="button">Settings</button>
    </div>

    <p class="status" id="status" role="status"></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
